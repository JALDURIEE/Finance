# TradingView A50 continuous futures example (anonymous access).
data_source:
  type: tradingview
  tradingview:
    ticker_mapping:
      A50: SGX:CN1!
    back_adjustment: true

ticker_source:
  type: manual
  manual:
    symbols: [A50]

download:
  period: 3mo
  interval: 1d

storage:
  type: csv
  output_dir: ./data/tradingview
  datetime:
    timezone: Asia/Shanghai
    format: "%Y/%m/%d %H:%M:%S"
