# IBKR A50 continuous futures example. TWS paper trading uses port 7497 by default.
data_source:
  type: ibkr
  ibkr:
    host: "127.0.0.1"
    port: 7496
    client_id: 20
    contracts:
      A50:
        sec_type: CONTFUT
        symbol: XINA50
        exchange: SGX
        currency: USD

ticker_source:
  type: manual
  manual:
    symbols: [A50]

download:
  period: "1y"
  interval: "15m"

storage:
  type: csv
  output_dir: "./data/ibkr"
  datetime:
    timezone: "Asia/Shanghai"
    # 美东时间可改为 "America/New_York"（自动处理夏令时）。
    format: "%Y-%m-%d %H:%M:%S"
