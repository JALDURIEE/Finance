# Financial Data Downloader Configuration

# Configure logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "" # Path to save logs, leave blank to disable file logging

# Configure the data source
data_source:
  type: "tradingview" # Supported: 'yfinance', 'ibkr', 'tradingview'
  yfinance:
    threads: true # If true, yf.download uses multi-threading. If false, it uses single-thread.
    # Optional mapping to convert local symbols to data source tracking symbols
    ticker_mapping:
      "VIX": "^VIX"
      "DJI": "^DJI"
      "SPX": "^GSPC"
      "RUT": "^RUT"
  ibkr:
    ticker_mapping:
      "DJI": "INDU"
      "BRK-B": "BRK B"
    host: "127.0.0.1"
    port: 7496
    client_id: 1
    historical_timeout: 180 # Seconds; 1y of 15m A50 bars took about 109s in a live test.
    contracts:
      A50:
        sec_type: CONTFUT
        symbol: XINA50
        exchange: SGX
        currency: USD
  tradingview:
    ticker_mapping:
      A50: SGX:CN1!
      AAPL: NASDAQ:AAPL
    back_adjustment: true
    daily_date_mode: "next_session"

# Configure where to get the tickers from
ticker_source:
  type: "manual" # Supported: 'wikipedia', 'local', 'manual'
  wikipedia:
    url: "https://en.wikipedia.org/wiki/Nasdaq-100" # URL of the Wikipedia page containing the symbol table
  local:
     # file_path: "tickers.txt" # Parses symbols line by line or from CSV
     dir_path: "~/Desktop/Watchlist" # Reads .txt files inside directory and merges symbols
  manual:
     symbols: ["A50"]

# Configuration for downloading history
download:
  period: "2y" # Format: '1mo', '3mo', '6mo', '1y', '5y', 'max' (depends on data source)
  interval: "1d" # Format: '1m', '5m', '15m', '1d', '1wk', '1mo'

# Configure where and how to save the data
storage:
  type: "csv"
  output_dir: "./data/csv" # Directory to save CSV files
  datetime:
    timezone: "Asia/Shanghai" # "Asia/Shanghai"  "America/New_York"（自动处理夏令时）。
    format: "%Y/%m/%d %H:%M:%S" # "%Y/%m/%d" "%Y/%m/%d %H:%M:%S"(分钟级别)
