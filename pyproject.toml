[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-downloader"
version = "0.1.0"
description = "A flexible financial data downloader supporting multiple sources like Yahoo Finance and IBKR."
authors = [
    { name = "JALDURIEE" }
]
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "yfinance>=0.2.30",
    "ib_async>=2.1,<3.0",
    "PyYAML>=6.0",
    "requests>=2.30.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923"
]
requires-python = ">=3.10"

[project.scripts]
finance-dl = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.yaml"]
